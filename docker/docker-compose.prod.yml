version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexustock-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexustock_main}
      POSTGRES_USER: ${POSTGRES_USER:-kingsman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kingsman} -d $${POSTGRES_DB:-nexustock_main}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexustock-redis-prod
    volumes:
      - redis_prod_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    image: ${NEXUSTOCK_API_IMAGE:-nexustock-api:phase26-local}
    container_name: nexustock-migration-prod
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
    environment:
      ConnectionStrings__Default: ${ConnectionStrings__Default}
      NEXUSTOCK_MIGRATE_ONLY: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${NEXUSTOCK_API_IMAGE:-nexustock-api:phase26-local}
    container_name: nexustock-api-prod
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
    ports:
      - "5024:8080"
    environment:
      ConnectionStrings__Default: ${ConnectionStrings__Default}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-Nexustock}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-Nexustock}
      ENABLE_REDIS: ${ENABLE_REDIS:-true}
      REDIS_CONNECTION: ${REDIS_CONNECTION:-redis:6379}
      Observability__EnableKpiSnapshotJob: ${Observability__EnableKpiSnapshotJob:-true}
      NEXUSTOCK_MIGRATE_ONLY: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    image: ${NEXUSTOCK_WEB_IMAGE:-nexustock-web:phase26-local}
    container_name: nexustock-web-prod
    build:
      context: ../
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "3003:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5024/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
